<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio AI Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&display=swap">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 1. The picture: sharp on load, then softly out of focus after 1 second */
  .hero {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    display: block;
    filter: blur(0);
    animation: defocus 1.6s ease-in-out 1s forwards;
  }
  @keyframes defocus {
    from { filter: blur(0); }
    to   { filter: blur(6px); }
  }

  /* 2. The label: LONDON, white on black. It pops up once the picture has gone
        soft (about 2.8s), then drifts slowly around the page and links to On View London.
        --px and --py run from 0 to 1 across the page; left/top plus the matching
        negative translate keep the label fully inside the window whatever its size. */
  @property --px { syntax: '<number>'; inherits: false; initial-value: 0.5; }
  @property --py { syntax: '<number>'; inherits: false; initial-value: 0.5; }

  .drift {
    position: fixed;
    left: calc(var(--px) * 100%);
    top: calc(var(--py) * 100%);
    transform: translate(calc(var(--px) * -100%), calc(var(--py) * -100%));
    /* two different periods so the path wanders instead of bouncing diagonally;
       negative delays start it near the middle of the page */
    animation:
      drift-x 53s ease-in-out -26s infinite alternate,
      drift-y 37s ease-in-out -18s infinite alternate;
  }
  @keyframes drift-x { from { --px: 0; } to { --px: 1; } }
  @keyframes drift-y { from { --py: 0; } to { --py: 1; } }
  /* hold still under the pointer so it is easy to click */
  .drift:hover { animation-play-state: paused; }

  .logo-link {
    display: block;
    padding: 0.45em 0.7em 0.4em;
    background: #000;
    color: #fff;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-stretch: 125%;
    font-size: clamp(13px, 1.7vw, 22px);
    letter-spacing: 0.08em;
    line-height: 1.25;
    text-align: left;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0);
    animation: pop 0.8s cubic-bezier(.2, .9, .3, 1.25) 2.8s forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  .logo-link:focus-visible {
    outline: 2px solid #0030c8;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; filter: blur(6px); }
    .drift { animation: none; left: auto; top: auto; right: 24px; bottom: 24px; transform: none; }
    .logo-link { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <img class="hero" src="images/studio-ai-ludo.png" alt="Studio AI Ludo">

  <div class="drift">
    <a class="logo-link" href="london/" aria-label="Exhibitions in London: On View London" title="On View London">Exhibitions<br>in London</a>
  </div>
</body>
</html>
