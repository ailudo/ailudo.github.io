<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio AI Ludo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    display: block;
    filter: blur(0);
    /* sharp on load, then drifts slightly out of focus after 1 second */
    animation: defocus 1.6s ease-in-out 1s forwards;
  }
  @keyframes defocus {
    from { filter: blur(0); }
    to   { filter: blur(6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    img { animation: none; }
  }
</style>
</head>
<body>
  <img src="picture.jpg" alt="Studio AI Ludo">
</body>
</html>
