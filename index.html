<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio AI Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&family=Inter:wght@700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 1. The picture: sharp on load, then softly out of focus after 1 second */
  .hero {
    margin: 0;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: min(24vmin, 22vw);
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: #111111;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    display: block;
    filter: blur(0);
    animation: defocus 1.6s ease-in-out 1s forwards;
  }
  @keyframes defocus {
    from { filter: blur(0); }
    to   { filter: blur(6px); }
  }

  /* 2. The label: LONDON, white on black. It pops up once the picture has gone
        soft (about 2.8s), then drifts slowly around the page and links to On View London.
        --px and --py run from 0 to 1 across the page; left/top plus the matching
        negative translate keep the label fully inside the window whatever its size. */
  @property --px { syntax: '<number>'; inherits: false; initial-value: 0.5; }
  @property --py { syntax: '<number>'; inherits: false; initial-value: 0.5; }

  .drift {
    position: fixed;
    left: calc(var(--px) * 100%);
    top: calc(var(--py) * 100%);
    transform: translate(calc(var(--px) * -100%), calc(var(--py) * -100%));
    /* two different periods so the path wanders instead of bouncing diagonally;
       negative delays start it near the middle of the page */
    animation:
      drift-x 53s ease-in-out -26s infinite alternate,
      drift-y 37s ease-in-out -18s infinite alternate;
  }
  @keyframes drift-x { from { --px: 0; } to { --px: 1; } }
  @keyframes drift-y { from { --py: 0; } to { --py: 1; } }
  /* hold still under the pointer so it is easy to click */
  .drift:hover { animation-play-state: paused; }

  .logo-link {
    display: block;
    padding: 0.45em 0.7em 0.4em;
    background: #000;
    color: #fff;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-stretch: 125%;
    font-size: clamp(13px, 1.7vw, 22px);
    letter-spacing: 0.08em;
    line-height: 1.25;
    text-align: left;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0);
    animation: pop 0.55s cubic-bezier(.2, .9, .3, 1.25) 0.2s forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* Paris label: same drift, different phase, Bodoni italic on white */
  .drift.paris {
    animation:
      drift-x 61s ease-in-out -9s infinite alternate,
      drift-y 43s ease-in-out -35s infinite alternate;
  }
  .drift.paris:hover { animation-play-state: paused; }
  .logo-link.paris {
    background: #fff;
    color: #111;
    font-family: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-stretch: 100%;
    letter-spacing: 0.01em;
    text-transform: none;
    font-size: clamp(15px, 2vw, 26px);
    animation-delay: 0.4s;
    box-shadow: inset 0 0 0 1.5px #111;
  }
  .logo-link:focus-visible {
    outline: 2px solid #0030c8;
    outline-offset: 4px;
  }

  /* Gym link: emoji drifting at its own period */
  .drift.gym {
    animation:
      drift-x 47s ease-in-out -31s infinite alternate,
      drift-y 59s ease-in-out -12s infinite alternate;
  }
  .drift.gym:hover { animation-play-state: paused; }
  .gym-link {
    display: block;
    font-size: clamp(28px, 4vw, 44px);
    text-decoration: none;
    line-height: 1;
    opacity: 0;
    transform: scale(0);
    animation: pop 0.55s cubic-bezier(.2, .9, .3, 1.25) 0.5s forwards;
  }
  .gym-link:focus-visible {
    outline: 2px solid #0030c8;
    outline-offset: 4px;
  }

  /* Zug link: a small black and light-blue chessboard, drifting at its own period */
  .drift.zug {
    animation:
      drift-x 67s ease-in-out -40s infinite alternate,
      drift-y 41s ease-in-out -7s infinite alternate;
  }
  .drift.zug:hover { animation-play-state: paused; }
  .zug-link {
    display: block;
    width: clamp(56px, 7vw, 96px);
    line-height: 0;
    opacity: 0;
    transform: scale(0);
    animation: pop 0.55s cubic-bezier(.2, .9, .3, 1.25) 0.7s forwards;
  }
  .zug-link svg { width: 100%; height: auto; display: block; }
  .zug-link:focus-visible {
    outline: 2px solid #0030c8;
    outline-offset: 4px;
  }

  /* Reduced motion: keep the one-off blur and pop-up, but do not let the labels wander.
     Add ?motion=on to the address to see the drifting anyway. */
  @media (prefers-reduced-motion: reduce) {
    html:not(.motion-on) .drift { animation: none; left: auto; top: auto; right: 24px; bottom: 24px; transform: none; }
    html:not(.motion-on) .drift.paris { right: auto; left: 24px; }
    html:not(.motion-on) .drift.gym { right: 24px; top: 24px; bottom: auto; left: auto; }
    html:not(.motion-on) .drift.zug { left: 24px; top: 24px; right: auto; bottom: auto; }
  }
</style>
<script>if(/[?&]motion=on\b/.test(location.search))document.documentElement.classList.add("motion-on");</script>
</head>
<body>
  <h1 class="hero">Studio<br>AI<br>Ludo</h1>

  <div class="drift">
    <a class="logo-link" href="london/" aria-label="Exhibitions in London: On View London" title="On View London">Exhibitions<br>in London</a>
  </div>

  <div class="drift paris">
    <a class="logo-link paris" href="paris/" lang="fr" aria-label="Expositions à Paris : On View Paris" title="On View Paris">Expositions<br>à Paris</a>
  </div>

  <div class="drift gym">
    <a class="gym-link" href="gym/" aria-label="Gym training tracker" title="Gym training tracker">💪</a>
  </div>

  <div class="drift zug">
    <a class="zug-link" href="zug/" aria-label="Zug: chess with friends by text message" title="Zug — chess by text message">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
        <defs><pattern id="sq" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#111111"/><rect width="1" height="1" fill="#A8D8F0"/><rect x="1" y="1" width="1" height="1" fill="#A8D8F0"/></pattern></defs>
        <rect width="8" height="8" fill="url(#sq)"/>
      </svg>
    </a>
  </div>
  <label id="hap" aria-hidden="true" style="position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden"><input type="checkbox" switch tabindex="-1"></label>
  <script>
  (function () {
    // A light haptic tick: the vibrate API on Android; on iPhone (iOS 18+) toggling a
    // native switch gives a tick. Browsers only allow these after the visitor has touched the page.
    var hap = document.getElementById('hap');
    function tick() {
      try { if (navigator.vibrate) { navigator.vibrate(12); return; } hap.click(); } catch (e) {}
    }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches && !document.documentElement.classList.contains('motion-on');
    var items = Array.prototype.slice.call(document.querySelectorAll('.drift'));

    // Each label drifts on two periods (seconds). A random point in each cycle gives a
    // random starting position; retry a few times so the labels do not start stacked.
    var periods = { london: [53, 37], paris: [61, 43], gym: [47, 59], zug: [67, 41] };
    function kind(el) { return el.classList.contains('paris') ? 'paris' : el.classList.contains('gym') ? 'gym' : el.classList.contains('zug') ? 'zug' : 'london'; }
    function where(offset, period) { // position 0..1 for an alternating ease-in-out cycle
      var t = offset % (2 * period), u = t < period ? t / period : 2 - t / period;
      return u * u * (3 - 2 * u);
    }
    if (!reduce) {
      var placed = [];
      items.forEach(function (el) {
        var per = periods[kind(el)], best = null, bestGap = -1;
        for (var i = 0; i < 25; i++) {
          var ox = Math.random() * 2 * per[0], oy = Math.random() * 2 * per[1];
          var x = where(ox, per[0]), y = where(oy, per[1]);
          var gap = placed.reduce(function (m, q) { return Math.min(m, Math.hypot(q[0] - x, q[1] - y)); }, 9);
          if (gap > bestGap) { bestGap = gap; best = [ox, oy, x, y]; }
          if (gap > 0.35) break;
        }
        placed.push([best[2], best[3]]);
        // longhands only, so the stylesheet's pause-on-hover still applies
        el.style.animationDuration = per[0] + 's, ' + per[1] + 's';
        el.style.animationDelay = (-best[0]).toFixed(2) + 's, ' + (-best[1]).toFixed(2) + 's';
      });
    }

    // Pop up in a random order, all within the first second, each with a tick.
    items.forEach(function (el) {
      var link = el.querySelector('a');
      var at = Math.random() * 0.85;
      link.style.animationDelay = at.toFixed(2) + 's';
      setTimeout(tick, at * 1000 + 120);
      link.addEventListener('pointerdown', tick);
    });
  })();
  </script>
</body>
</html>
