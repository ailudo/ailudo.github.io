<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Map of Tree of Man · 人树地图</title>
<meta name="description" content="An interactive reading map of Patrick White's The Tree of Man: twelve stretches of the novel, its people and houses, and eleven concepts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a strip of the novel's twelve stretches, drawn to their true length, sits above a
   two-column workbench: a radial map on the left, a reading panel on the right. */
:root{
  --bg:#e8ece6; --panel:#f5f7f2; --ink:#1c2620; --muted:#5d6b62; --line:#c3ccc2;
  --leaf:#2c5f4f; --leaf-soft:#d3e2d8; --glass:#8a2f52; --glass-soft:#f0d9e1; --bark:#6f5a3c; --facebg:#f4f1e6;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131a16; --panel:#1b2520; --ink:#e4ebe4; --muted:#9aa89f; --line:#34423a;
    --leaf:#8cc7ad; --leaf-soft:#24382f; --glass:#e58aa8; --glass-soft:#3a1f2a; --bark:#c2a67a; --facebg:#d5dbd0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131a16; --panel:#1b2520; --ink:#e4ebe4; --muted:#9aa89f; --line:#34423a;
  --leaf:#8cc7ad; --leaf-soft:#24382f; --glass:#e58aa8; --glass-soft:#3a1f2a; --bark:#c2a67a; --facebg:#d5dbd0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-size:30px;line-height:1.2;margin:0;font-weight:700;letter-spacing:.04em}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:4px}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.modes button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--leaf);color:var(--bg)}

/* strip */
.stripbox{overflow-x:auto;padding-bottom:4px}
.strip{display:flex;gap:3px;min-width:900px}
.seg{flex:1 1 0;min-width:68px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.seg .ch{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg .t{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.3}
.seg .mk{font-size:11px;color:var(--glass);font-weight:700;min-height:17px}
.seg.hit{border-color:var(--glass)}
.seg.hit::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--glass);border-radius:5px 5px 0 0}
.seg[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.seg[aria-pressed="true"] .ch,.seg[aria-pressed="true"] .mk{color:var(--bg)}
.parts{display:flex;gap:3px;min-width:900px;margin-top:5px;font-size:11px;color:var(--muted)}
.parts span{border-top:2px solid var(--bark);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12px;color:var(--muted);margin:0}

/* concept chips row */
.conrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.chip.c{border-color:var(--leaf);color:var(--leaf)}
.chip.p{border-color:var(--bark)}

.bench{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.map{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;position:sticky;top:10px}
@media (max-width:860px){.map{position:static}}
svg{display:block;width:100%;height:auto}
.edge{stroke:var(--line);stroke-width:1.2}
.edge.on{stroke:var(--glass);stroke-width:2}
.node{cursor:pointer}
.node .ring{fill:var(--facebg);stroke:var(--bark);stroke-width:1.5}
.node.fam .ring{stroke:var(--leaf);stroke-width:2.5}
.node.con .ring{fill:var(--leaf-soft);stroke:var(--leaf)}
.node.stg .ring{fill:var(--glass-soft);stroke:var(--glass)}
.node.on .ring{stroke:var(--glass);stroke-width:4}
.node.con.on .ring,.node.stg.on .ring{fill:var(--glass)}
.node.dim{opacity:.28}
.region{fill:var(--bg);stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.rtitle{fill:var(--muted);font-family:var(--display);font-size:13px;font-weight:700}
.kin{stroke:var(--bark);stroke-width:1.6;fill:none}
.kin.loose{stroke-dasharray:5 4}
.kinlab{fill:var(--bark);font-size:10.5px;text-anchor:middle;font-family:var(--body)}
.actl{stroke:var(--glass);stroke-width:1.8;fill:none}
.actt{fill:var(--glass);font-family:var(--body);font-size:12px;font-weight:700;text-anchor:middle;stroke:var(--panel);stroke-width:4;paint-order:stroke;stroke-linejoin:round}
#ar path{fill:var(--glass)}
.mapscroll{overflow-x:auto}
.mapscroll svg{min-width:560px}
.node text{fill:var(--ink);font-family:var(--body);font-size:13px;text-anchor:middle}
.node text.sub{fill:var(--muted);font-size:10.5px}
.node:hover .ring{stroke-width:3.5}
.hub text{fill:var(--bg);font-family:var(--display);font-weight:700;text-anchor:middle}
.hub text.sub{font-family:var(--body);font-weight:400;font-size:11px}
.hub .hubc{fill:var(--leaf);stroke:none}
.node.hub text,.node.hub text.sub{fill:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:2px 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bark);margin-right:5px;vertical-align:-1px}
.legend i.f{background:var(--leaf-soft);border-color:var(--leaf)}
.legend i.s{border-radius:2px;background:var(--glass-soft);border-color:var(--glass)}

.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-family:var(--display);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
.panel h2 span{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.eyebrow{font-size:12px;color:var(--muted);margin:0 0 2px;font-variant-numeric:tabular-nums}
.lead{margin:0;max-width:36em}
.panel h3{font-size:12px;font-weight:700;color:var(--leaf);margin:0 0 6px;letter-spacing:.12em}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;max-width:38em}
.tag{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.link{border:0;background:none;padding:0;font-weight:700;color:var(--leaf);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;white-space:nowrap;text-align:left}
.list li.now{background:var(--leaf-soft);border-radius:6px;padding:6px 8px;margin:0 -8px}
blockquote{margin:0;padding:8px 14px;border-left:3px solid var(--glass);background:var(--glass-soft);border-radius:0 6px 6px 0;font-family:var(--display);font-size:16px;max-width:34em}
blockquote .ctx{font-family:var(--body);font-size:13px;color:var(--ink);margin:4px 0 0}
blockquote cite{display:block;font-family:var(--body);font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.quotes{display:flex;flex-direction:column;gap:8px}
.back{align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--glass-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:60em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>人树地图<small>A Map of Tree of Man · 帕特里克·怀特《人树》1955</small></h1>
    <div class="modes" role="group" aria-label="视图">
      <button id="m-timeline" aria-pressed="true" data-act="mode" data-id="timeline">时间线 · 人物</button>
      <button id="m-concepts" aria-pressed="false" data-act="mode" data-id="concepts">概念</button>
    </div>
  </header>

  <section id="v-timeline">
    <div class="stripbox"><div class="strip" id="strip"></div><div class="parts" id="parts"></div></div>
    <p class="hint">每一格的宽度按该段在译本中的篇幅绘制。选一段，地图上亮起这一段出场的人，红线是这一段里发生在他们之间的事。点一个人，看他一生的全部连线。</p>
  </section>

  <section id="v-concepts" hidden>
    <div class="conrow" id="conrow"></div>
  </section>

  <div class="bench">
    <div class="map"><div id="graph" class="mapscroll"></div><div class="legend" id="legend"></div></div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>

  <footer>引文为所附中译本里的短句，只取片段并标明章次，译本中的个别错字照原样保留。四部的划分依英文原版，译本本身只分二十六章。概述和概念归纳是这张图的解读，不是原文。头像是按书中零星描写自行画的示意。英文人名、地名取自英文原著。 <a href="../" style="color:inherit">An AI project by Studio AI Ludo</a></footer>
</div>

  let labs='';
  acts.forEach((a,i)=>{const p=POS[a[0]],q=POS[a[1]];let dx=q[0]-p[0],dy=q[1]-p[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
    let nx=dy,ny=-dx;if(ny>0||(ny===0&&nx>0)){nx=-nx;ny=-ny}

const MORE={
s1:'开头几乎没有对话。斯坦的来历是倒着交代的：柳溪（Willow Creek）的老房子，铁匠父亲艾德·帕克，教过书、想让他当教师或传道士的母亲。他自己只想找个地方永远待下去。艾米是凯利角菲宾斯家的孩子，跟着姨父姨母长大，十六岁起给人帮工，唯一敬重的人是牧师的妻子埃尔贝太太，那本《圣经》和银擦板都是她给的。两人在尤罗加（Yuruga）的教堂舞会上认识，几乎没有恋爱就结了婚。第四章里艾米一个人在空地上等丈夫从班加雷（Bangalay）赶集回来，开始觉得自己被这片寂静缩小了。',
s2:'这一段写的是“两个人”怎样变成“一个地方”。欧达乌德太太胖墩墩地坐在大车上闯进来，说她家离这儿只有一两英里，那匹栗色母马就死在拐弯的地方。艾米擦桌子时一直想着她，因为她以前从来没有过朋友。雷暴那一夜，夫妻俩在雨里搂抱着找对方的脸，棚屋塌了，三只小母鸡被压扁。第六章搬进斯坦和奎克莱依家小伙子们盖的新房，艾米怀了孕，盼着是个小姑娘。母牛病倒的夜里，欧达乌德教他们往啤酒瓶里灌煤油给牛治病，牛还是死了，艾米往回跑得太快，孩子没保住。',
s3:'全书最长的单章之一。洪水是邻居们的一次出征，也是斯坦第一次看见大量的死亡：水漫进窗户，在教堂尖顶下打旋，柳树下漂着人脸和牲口。女人们留在岸上的临时救济处，欧达乌德太太一路评点，阿姆斯特朗家的轻便马车从她们身边溅着泥水驶过。回程的大车上最后只剩帕克夫妇和一个没人认领的男孩，他手里攥着一块红玻璃。艾米在想象里已经和他一起坐在教堂长椅上了。这是她第一次想要占有一个人而落空，后面还有许多次。',
s4:'四章合在一起是帕克家的壮年。第八章用杂货铺和邮局给村子定了名，也引出邮政局长盖奇太太和她那位没人注意的丈夫。第九章孩子出生，艾米却并不因此满足，她看着丈夫，觉得还没能把他整个得到；雷从小就大吵大闹，爬到很高的树上，对一只空鸟巢都带着轻蔑。同一章里欧达乌德太太带来了马德琳的消息，从此大路尽头总有一位骑马的女人。第十章是一出闹剧，酒醒后的欧达乌德哭着说都是性格害了他。第十一章回到斯坦：雷电让他觉得皮肉都从骨头上脱落了，他在门廊上学会了卑微，第二天照样去跟奥塞·皮博迪为一头牛犊讲价。',
s5:'这一章的前半是艾米的。她提着鸭子走进格兰斯顿伯里（Glastonbury）的厨房，厨娘弗里斯巴依太太把硬币扔给她，说起这场宴会是为了马德琳和小阿姆斯特朗的婚事。艾米隔着门看见那些像金属丝一样脆的客人。后半是斯坦的。火起初只是烟味，男人们还开着玩笑回家睡觉；第二天几个孩子飞跑来报信，火已经进了河谷。斯坦穿着笨重的靴子踢开一扇扇门找到马德琳。楼梯上的那几行是全书最接近情欲的地方，她承认他的汗水让她沉醉。两人出来以后，这件事再没有被任何人说起。',
s6:'第十三章里村子自己先打了一场小仗。欧达乌德太太拿到厨娘的信，说马德琳“有的那点感情在起火的那天晚上也都烧光了”；艾米夜里还梦见自己在火里旋转。然后莫瑞阿蒂在杂货铺宣布开战，雷兴奋得吃不下饭，奥塞·皮博迪来敲打艾米，说这时候还养着一个德国佬不合适。弗利兹脸色像纸一样白，蹒跚着回了棚屋，随后离开。斯坦吻别时艾米穿着白罩衫，僵硬得像个陌生人。第十四章只有十几段，写炮弹炸开的皮肉、战友汤姆·阿切尔和杰克·萨利文的死、斯坦在一座只剩窗框的教堂里坐着。他的信问的是母牛彻丽下犊了没有。',
s7:'战争没有给杜瑞尔盖带来什么损失，这是这章的第一句话，也是它的讽刺。斯坦不在的时候，一个腿上带伤的年轻兵路过，艾米在大丽花的荫凉里和他说了一会儿话，那是她第一次意识到自己可以被陌生人注意。斯坦回来以后，差点开口问孩子们几岁。多尔光着脚来送她烤的点心，艾米笑她是爱上了斯坦。斯坦独自走上山坡，格兰斯顿伯里的新房盖到一半就废了，有过路人在里面生过火。然后是希腊人柯：艾米给他一个大红苹果，看他咬下去；雷翻他的盒子，把那把上了油的刀子拿在手里掂量。柯唱完歌宣布要去邦代娶一个开铺子的寡妇。',
s8:'两个孩子用两种方式离开。雷在班加雷寄住在诺斯科特大妈家，跟鞍具匠贾漫学徒，父亲羞于把这个儿子拿到众人面前；他留下一封信说“反正我得动动地方”，进城给卖赛马彩票的伯尼·亚伯拉罕姆斯干活，一桩蹊跷的事连累霍瑞·鲍凯丢了差事。斯坦进城去找他，坐电车、问路，最后站在大街上明白自己见不着儿子了。塞尔玛的信则越写越得体：气喘病不大犯了，想去配副眼镜，想在证券经纪人或律师那里找个工作。第十七章，盖奇先生死了，太太们来“表示同情”，艾米一个人在那些画前面站住。回家路上欧达乌德夫妇拉她喝酒，欧达乌德说他也知道该画什么。',
s9:'这一章把两件看似无关的事叠在一起，干旱和通奸。天空像一张白纸，人们先是互相打量，后来只盯着天。利奥是个块头很大的男人，带着衣料、长统袜和时新的扣子。艾米站在高出地面的门廊上跟他谈起丈夫的信仰，然后让他进了屋。事后她把那看成是往丈夫脸上、也往丈夫那位上帝的神秘上吐了一口。斯坦认出那辆车，没有进屋，一路开到城里，喝到在巷子里呕吐、撒尿。他回来时她正说着新下的牛犊，两个人忽然变得彼此客气起来。',
s10:'第四部从一辆汽车开始，孩子们如今是开车回来的。达德利·福斯迪克是律师事务所的合伙人，塞尔玛原是那里的打字员，她听见打字机换行的铃声还会心惊。父亲居然能和这位不带感情色彩的女婿在牛棚边谈得很自在，让母女俩都有点气恼。同一章的夜里，多尔来报信，艾米提着灯推开格兰斯顿伯里生锈的大门。雷说自己在西部跑船，从墨尔本搭货车回来；他吃完东西就要走，她想学会怎样留住他，却什么也没学会。第二十章里花园开始吞没房子，年轻的乔·皮博迪来帮斯坦围篱笆，盖奇太太路过叙旧。埃尔西带着婴儿住下时，一场暴风雨把两个女人刮得笑起来。艾米翻出一只铁盒，里面有几片红玻璃。',
s11:'杜瑞尔盖成了郊区。塞尔玛带来一个“小小的计划”，劝父母把地分批卖掉，斯坦其实早就想到了。老两口有时进城逛街，发现自己还很健壮。《哈姆雷特》是斯坦提议去看的：他母亲当年指着书讲给他听，如今台上的毒药让他想起那辆蓝色汽车，艾米坐在顶层楼座上想要回她的小男孩。圣餐一场里，年轻牧师像用榔头往人灵魂里钉信仰，斯坦嗓子发干，尝到酒里有那天夜里的胆汁味。第二十二章是两次来访。雷衣着华贵，教那个陌生的男孩往水坑里扔石头；塞尔玛领来一位皮肤像白垩的菲希尔太太，她站在台阶上问格兰斯顿伯里在哪个方向。',
s12:'四章四场死亡，写法各不相同。雷的死先出现在晨报上，斯坦光着头站在寒霜里读；过后才由罗拉在她的住处讲给艾米听，阿尔费怎样走进来，雷怎样转过身。欧达乌德太太把病说成一个从网袋里甩出来的小包，两个黑不溜秋的老女人在冷阳光下走了一小段路。多尔的一章最短也最静，她穿着体面的小方格裙子来通知艾米。最后是斯坦：花园以他为中心一圈圈展开，他坐在草地上，被一个出汗的年轻人追问信不信上帝。同一天艾米找到了埃尔贝太太送的银擦板，他已经不记得那是什么了。第二十六章不到一页，从“归根结底”开始，也以它结束。'};

const BIO={
stan:'铁匠艾德·帕克的儿子，在柳溪长大，母亲教过书，给了他一笔工整的字和一点读过的书。小说对他的定义出现在第一章：他只是一个普通人，不善于解释。他砍树、挤奶、送奶油，从不缺一次；他救过人，打过仗，被妻子背叛过，都没有说什么。怀特把一场漫长的、不借助任何教义的寻找放在这样一个人身上，全书的结构就是他被一次次灾难推着往里走。',
amy:'凯利角菲宾斯家的孩子，家里穷，孩子多，她跟着姨父姨母长大，出嫁前没有爱过谁。她比斯坦会说话，也比他更需要别人：一个朋友，一个孩子，一个可以拿来做梦的贵妇，一个路过的男人。她几乎每次伸手都抓空。她不是坏人，书里的大部分温情也来自她：她给战场上的丈夫写信，给逃亡的儿子送饭，守着邻居死。结尾时银擦板找到了，丈夫却走了。',
ray:'头生子，来得很晚，被母亲爱得透不过气。小时候他躲进屋后的溪谷，母亲追不上；他说自己不结婚，要去赛马，或者徒步横跨澳大利亚。此后的每一份营生都比上一份更靠近底层：鞍具学徒，赛马彩票，西部的货船，卖汽车，最后是夜总会。他知道自己一无所有，偶尔回家一次，穿得很讲究，像在给父母看一件戏装。',
thelma:'从小苍白，有气喘病，头发颜色很浅。她很早就明白乡下出身是一件要处理掉的东西，于是学打字、速记，进律师事务所，嫁给合伙人，住进能望见海港的房子，再去读伦理学和人类学、听音乐会。她对父母有礼而疏远，承认父亲“人品是相当难得的”。父亲死后她才真正想起他的手。她没有孩子。',
odowd_mrs:'帕克家往外一两英里的邻居，从一辆大车上闯进艾米的生活，此后五十年都是她的消息来源、对头和伴儿。她的话是全书最鲜活的口语，不敬神父，不怕丈夫，连自己是不是他合法的妻子也满不在乎地说破。她和艾米吵过，为马德琳，为各自的丈夫，每次都舍不得真的翻脸。',
odowd:'欧达乌德太太的男人。清醒时是个传授土法的热心邻居，喝了酒就放枪、提刀，把两个女人追得绕屋跑，酒醒又哭。书里拿他和斯坦对照：一个把什么都喊出来，一个什么都不说。',
doll:'奎克莱依家的女儿，瘦长，光着脚，从小孩儿直接长成老姑娘，村里人后来都叫她奎克莱依小姐。她帮帕克家盖房，给归来的斯坦烤点心，守着犯病的弟弟，往他嘴里塞软木。斯坦觉得岁月没有在她身上留下泥。她是书里最接近“圣徒”的人，她的结局也因此最难承受。',
bub:'多尔的弟弟，娃娃脸，智力停在童年，会犯很凶的病。他喜欢石头、树枝和山羊。多尔常想自己应当更爱他。',
fritz:'在洪水那年来到帕克家的德国老头，住在棚屋里，和斯坦一起种地，是斯坦少有的朋友。战争一来，村里人忽然想起了他的国籍。',
boy:'没有名字。洪水退后没人认领，被帕克夫妇用大车带回家。他有一块红玻璃，说透过它看，洪水是紫红色的。艾米留着那些碎片，几十年后放在一只画着小花的铁盒里。',
gage:'邮政局长的丈夫，干些零活，村里人几乎想不起他的存在。艾米只真正见过他一次，他趴在地上，整个人被一只蚂蚁吸住。他死后人们才知道他一直在画。',
mrsgage:'杜瑞尔盖的邮政局长，有一架钢琴，嘴快，日子经她一讲总是活灵活现。丈夫自缢后她把画摆出来，既是诉苦也是示众。多年后她胖了，路过时与艾米在大路上互相认出。',
madeleine:'格兰斯顿伯里的常客，传言中小汤姆·阿姆斯特朗的未婚妻。艾米从没和她说过话，却在心里跟着她过了许多年。火灾以后她离开了，再出现时是塞尔玛的朋友菲希尔太太，皮肤像白垩，对自己的优雅也不满意，说想养蜂。',
armstrongs:'杜瑞尔盖一带最有钱的人家，住在砖砌的别墅格兰斯顿伯里，有厨娘、宴会和从城里来的客人。阿姆斯特朗太太为自己的富有感到负疚。别墅烧掉后他们动手重建，儿子小汤姆战死，老头中风，工程就停在半截。',
ossie:'帕克家的邻居，有一大家子要养。他有马车，肯帮忙，也肯占便宜，人们都说他奸滑。后来他家的年轻人乔·皮博迪还来帮斯坦围篱笆。',
con:'战后流落到这一带找活干的希腊青年，不会说这里的话，会唱歌，有一只装着私人物件的盒子。他在帕克家没待多久，全家人却都被他改变了一点。',
leo:'块头很大的流动推销员，开一辆蓝色汽车，爱讲乡村小镇的轶事。他来过两次。',
dudley:'律师事务所的合伙人，娶了自己所里的打字员。开车时不喜欢分心。他读了太多关于别人如何生活的文件，偶尔会对真正的生活生出过分迫切的好奇。',
elsie:'悉尼来的姑娘，戴一顶拉得很低的大黑帽子，朴素，壮实。她很快明白自己得不到足够的恩爱，却没有因此变坏。艾米先是挑剔她，后来爱她。',
lola:'雷离开埃尔西后跟的女人，年纪不轻，在艾米口中是“那个婆娘”。雷死的那晚她在场。',
grandson:'埃尔西和雷的儿子。祖父曾对他说起小时候用蓝铅笔画地图上的海湾。他个子长得太快，衣袖都短了。',
bourkes:'莉莉原是尤罗加绸布商伯特家的三女儿，斯坦母亲那边的亲戚，嫁给了与赛马打交道的霍瑞·鲍凯，住在兰德维克。她说大家都喜欢斯坦，可他慢吞吞的，是艾米“招赘”了他。',
evangelist:'一个挨家传福音的年轻人，自述过去酗酒、玩女人，后来跪在地上得了救。他相信同样的事也会发生在这个老头身上。',
stranger:'帕克夫妇婚后见到的第一个外人，秃顶上搭着几缕头发，自称曾在非洲调查贩卖红木的生意。他把《圣经》和药水一起卖。',
parents:'父亲艾德·帕克是铁匠，力气大，喝酒；母亲教过书，读书，手指后来生了关节炎。《哈姆雷特》和《旧约》都是她带进这个家的。',
lolaboy:'雷和罗拉的儿子，长得漂亮，被带来见祖母一次。'};
const CMORE={
god:'值得留意的是每一步都发生在身体上而不在头脑里：跪下，淋雨，嗓子发干，呕吐，吐唾沫。斯坦从没有读过神学，也没有和谁讨论过。教堂在书里一再出现，却总是不顶用：艾米在彩色玻璃窗下没有得到恩赐，前线的教堂只剩窗框，圣餐酒里是胆汁味。最后那位传教士带来的是别人的得救故事，斯坦用拐杖一指，给了他一个自己的。',
silence:'这也是怀特给自己出的题：怎样用语言去写不靠语言生活的人。他的办法是让叙述贴着人物的感觉走，句子常常断在半截。书里真正流利的人都不大可靠，推销员、律师、传教士、塞尔玛。艾米晚年抱怨受过教育的人把话里的意思都“漂白”光了。',
possess:'艾米的每一次占有都对应一件小东西：银擦板，白玫瑰，给雷的笔记本，给柯的红苹果，铁盒里的碎玻璃。她收着这些东西，就像收着没能留住的人。书对她并不苛刻，它只是一次次让她看见，被爱的人有一个她到不了的地方。',
disaster:'五场灾难的排列有一种近乎《旧约》的节奏，雷、水、火、刀兵、旱。每一场之后小说都特意写日常怎样回来：压扁的母鸡喂了狗，烧焦的山谷重新变绿，战后的头一句是村子没什么损失。启示来过，没有留下可以指给别人看的痕迹。',
root:'“扎根”在书里不全是褒义。斯坦的留守有时近于迟钝，莉莉·鲍凯说他慢慢吞吞；而雷那句“反正我得动动地方”引的正是父亲的话。到第四部，连土地本身也不再是可以扎根的东西，它被分成一块块卖给盖房子的人。',
ordinary:'这些小东西几乎都与“看”有关：趴下去看，透过玻璃看，在牛棚的昏暗里看。书里的人大多看不见，看见的那几个，盖奇、斯坦、那个孩子，都付出了被当作怪人或者干脆消失的代价。',
alone:'小说并不把这写成失败。帕克夫妇之间有习惯、照料和偶尔涌上来的柔情，艾米老了还会拂着丈夫的袖子问他要一个吻。只是每个人最要紧的那部分经验，斯坦的上帝，艾米的欲望，都是独自经历的，对方只看见它留在脸上的影子。',
art:'三次里只有盖奇是创作者，其余都是观众。怀特让最不可能的人做了最好的观众：艾米没有知识，却在那幅耶稣前面“理解了它”；斯坦看《哈姆雷特》时整晚没有表情，回家以后那出戏才在他身上发作。塞尔玛懂得最多，得到的反而最少。',
suburb:'这条线写得很平静，没有挽歌的腔调。新房子里的人有他们自己的日子，帕克老两口只是不再相信眼前发生的事。花园是艾米对郊区的回答：她不按计划，看见什么想要就栽什么，最后花木把房子围了起来，斯坦死在它的正中。',
class:'体面在书里总带着一点人工的气味：塞尔玛嘴里紫罗兰味的口香糖，鲍凯家的热那亚天鹅绒，律师太太们的珍珠项链。与之相对的是多尔那张毫无装饰的桌子，塞尔玛在它面前觉得自己“变得可疑了”。',
cycle:'循环并不等于重复。斯坦带着斧子进树林，孙子带着一块玻璃；一个要开出一块地，一个要写一首诗。中间那一代是断裂的，雷和塞尔玛都没有接住父母的东西，它绕过他们传了下去。'};

const S=id=>STAGES.find(s=>s.id===id), C=id=>CON.find(c=>c.id===id);
const st={mode:'timeline',stage:'s1',char:null,con:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const quote=q=>`<blockquote>“${esc(q[0])}”<cite>第${q[1]}章${q[2]?' · '+esc(q[2]):''}</cite>${QCTX[q[0]]?`<p class="ctx">${esc(QCTX[q[0]])}</p>`:''}</blockquote>`;
const btn=(act,id,label,cls='link',extra='')=>`<button class="${cls}" data-act="${act}" data-id="${id}" ${extra}>${esc(label)}</button>`;

function graph(hub,nodes){
  const W=680,H=520,cx=W/2,cy=H/2-6,n=nodes.length;
  let edges='',out='';
  nodes.forEach((d,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, k=(n>8&&i%2)?.66:1;
    const x=cx+Math.cos(a)*262*k, y=cy+Math.sin(a)*190*k;
    const r=d.w===3?24:d.w===2?18:13;
    edges+=`<line class="edge${d.on?' on':''}" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const isP=!d.type&&F[d.id], rr=isP?r+5:r;
    const shape=d.type==='stg'?`<rect class="ring" x="${(x-15).toFixed(1)}" y="${(y-15).toFixed(1)}" width="30" height="30" rx="5"/>`:`<circle class="ring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}"/>`+(isP?face(d.id,x,y,rr-3):'');
    const ly=y+(d.type==='stg'?15:rr)+16;
    out+=`<g class="node ${d.type||''}${d.fam?' fam':''}${d.on?' on':''}" tabindex="0" role="button" aria-label="${esc(d.label)}" data-act="${d.act}" data-id="${d.id}">${shape}<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}">${esc(d.label)}</text>${d.sub?`<text class="sub" x="${x.toFixed(1)}" y="${(ly+14).toFixed(1)}">${esc(d.sub)}</text>`:''}</g>`;
  });
  const hubG=`<g class="hub${hub.act?' node':''}" ${hub.act?`tabindex="0" role="button" data-act="${hub.act}" data-id="${hub.id||''}"`:''}><circle class="hubc" cx="${cx}" cy="${cy}" r="50"/><text x="${cx}" y="${cy+(hub.sub?0:7)}" font-size="${hub.label.length>4?16:20}">${esc(hub.label)}</text>${hub.sub?`<text class="sub" x="${cx}" y="${cy+19}">${esc(hub.sub)}</text>`:''}</g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="关系图">${edges}${hubG}${out}</svg>`;
}

function charsIn(sid){return Object.keys(CH).filter(k=>CH[k].in[sid]).sort((a,b)=>CH[b].w-CH[a].w)}

function renderStrip(){
  const tot=STAGES.reduce((a,s)=>a+s.w,0);
  $('strip').innerHTML=STAGES.map(s=>`<button class="seg${s.kind?' hit':''}" style="flex-grow:${s.w}" aria-pressed="${st.stage===s.id}" data-act="stage" data-id="${s.id}"><span class="ch">第${s.ch}章</span><span class="t">${s.t}</span><span class="mk">${s.mk||''}</span></button>`).join('');
  $('parts').innerHTML=[1,2,3,4].map(p=>{const w=STAGES.filter(s=>s.part===p).reduce((a,s)=>a+s.w,0);return `<span style="flex:${w} 1 0;min-width:0">${PARTS[p-1]}</span>`}).join('');
}

function renderTimeline(){
  const s=S(st.stage), ids=charsIn(s.id);
  if(st.char&&!CH[st.char].in[s.id])st.char=null;
  $('graph').innerHTML=placeMap(s.id,st.char);
  $('legend').innerHTML='<span>虚线框：住处</span><span>双线：夫妻　虚线：同居或客居　折线：亲子</span><span>红线：'+(st.char?'此人一生的举动':'这一段里的举动')+'</span><span>变淡的人这一段不出场</span>';
  let h='';
  if(st.char){
    const c=CH[st.char];
    h+=btn('char','', '← 回到「'+s.t+'」','back');
    h+=`<div><p class="eyebrow">人物</p><h2>${esc(c.n)}<span>${esc(c.en)}</span></h2></div><p class="lead">${esc(c.role)}</p><p class="lead">${esc(BIO[st.char]||'')}</p>`;
    h+=`<div><h3>一生轨迹</h3><ul class="list">${STAGES.filter(x=>c.in[x.id]).map(x=>`<li class="${x.id===s.id?'now':''}">${btn('stage',x.id,x.t)}<span>${esc(c.in[x.id])} <span class="tag">第${x.ch}章</span></span></li>`).join('')}</ul></div>`;
    if(c.q.length)h+=`<div><h3>原句</h3><div class="quotes">${c.q.map(quote).join('')}</div></div>`;
    const mine=ACTS.filter(a=>a[0]===st.char||a[1]===st.char);
    if(mine.length)h+=`<div><h3>关系与举动</h3><ul class="list">${mine.map(a=>`<li>${btn('stage',a[3],S(a[3]).t)}<span>${esc(SHORT[a[0]])} ${a[4]?'→':'—'} ${esc(SHORT[a[1]])}：${esc(a[2])}</span></li>`).join('')}</ul></div>`;
    h+=`<div><h3>相关人物</h3><div class="conrow">${c.rel.map(r=>btn('goto-char',r,CH[r].n,'chip p')).join('')}</div></div>`;
    h+=`<div><h3>相关概念</h3><div class="conrow">${c.con.map(r=>btn('goto-con',r,C(r).t,'chip c')).join('')}</div></div>`;
  }else{
    h+=`<div><p class="eyebrow">${PARTS[s.part-1]} · 第${s.ch}章</p><h2>${esc(s.t)}<span>${esc(s.en)}</span></h2></div><p class="lead">${esc(s.sum)}</p><p class="lead">${esc(MORE[s.id])}</p>`;
    h+=`<div><h3>发生了什么</h3><ul class="list">${s.ev.concat(EV2[s.id]||[]).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).map(e=>`<li><span class="tag">第${e[0]}章</span><span>${esc(e[1])}</span></li>`).join('')}</ul></div>`;
    if(s.q.length)h+=`<div><h3>原句</h3><div class="quotes">${s.q.map(quote).join('')}</div></div>`;
    h+=`<div><h3>这一段里的人</h3><ul class="list">${ids.map(k=>`<li>${btn('char',k,CH[k].n)}<span>${esc(CH[k].in[s.id])}</span></li>`).join('')}</ul></div>`;
    h+=`<div><h3>相关概念</h3><div class="conrow">${s.con.map(r=>btn('goto-con',r,C(r).t,'chip c')).join('')}</div></div>`;
  }
  $('panel').innerHTML=h;
}

function renderConcepts(){
  $('conrow').innerHTML=btn('con','', '全部','chip',`aria-pressed="${!st.con}"`)+CON.map(c=>btn('con',c.id,c.t,'chip',`aria-pressed="${st.con===c.id}"`)).join('');
  let h='';
  if(!st.con){
    $('graph').innerHTML=graph({label:'人树'},CON.map(c=>({id:c.id,label:c.t,sub:c.en,w:2,type:'con',act:'con'})));
    $('legend').innerHTML='<span>点一个概念，看它在谁身上、在哪一章出现</span>';
    h+=`<div><p class="eyebrow">十一个概念</p><h2>这本书在问什么</h2></div><p class="lead">时间线按“发生了什么”排，这里按“为什么写”排。每个概念下面有三样东西：不同人物给出的不同回答，书里的例证，和几句原话。</p>`;
    h+=`<ul class="list">${CON.map(c=>`<li>${btn('con',c.id,c.t)}<span>${esc(c.gist.split('。')[0])}。</span></li>`).join('')}</ul>`;
  }else{
    const c=C(st.con);
    const nodes=c.takes.map(t=>({id:t[0],label:SHORT[t[0]],sub:EN[t[0]],w:CH[t[0]].w,fam:CH[t[0]].fam,act:'focus'}))
      .concat(c.ex.map((e,i)=>({id:'ex'+i,label:S(e[0]).t,sub:'第'+e[1]+'章',type:'stg',act:'focus'})));
    $('graph').innerHTML=graph({label:c.t,sub:c.en,act:'con',id:''},nodes);
    $('legend').innerHTML='<span><i class="f"></i><i></i>人物的回答</span><span><i class="s"></i>书中的例证</span><span>点中心回到全部概念</span>';
    h+=`<div><p class="eyebrow">概念</p><h2>${esc(c.t)}<span>${esc(c.en)}</span></h2></div><p class="lead">${esc(c.gist)}</p><p class="lead">${esc(CMORE[c.id])}</p>`;
    h+=`<div><h3>不同的回答</h3><ul class="list">${c.takes.map(t=>`<li id="f-${t[0]}">${btn('goto-char',t[0],CH[t[0]].n)}<span>${esc(t[1])}</span></li>`).join('')}</ul></div>`;
    h+=`<div><h3>例证</h3><ul class="list">${c.ex.map((e,i)=>`<li id="f-ex${i}">${btn('goto-stage',e[0],S(e[0]).t)}<span>${esc(e[2])} <span class="tag">第${e[1]}章</span></span></li>`).join('')}</ul></div>`;
    h+=`<div><h3>原句</h3><div class="quotes">${c.q.map(quote).join('')}</div></div>`;
    h+=`<p class="hint">人名和段落名都可以点，会跳到时间线上对应的位置。</p>`;
  }
  $('panel').innerHTML=h;
}

function render(){
  const tl=st.mode==='timeline';
  $('v-timeline').hidden=!tl; $('v-concepts').hidden=tl;
  $('m-timeline').setAttribute('aria-pressed',tl); $('m-concepts').setAttribute('aria-pressed',!tl);
  if(tl){renderStrip();renderTimeline()}else renderConcepts();
}
function firstStage(cid){return STAGES.find(s=>CH[cid].in[s.id]).id}
function act(a,id){
  if(a==='mode'){st.mode=id;try{history.replaceState(null,'','#'+id)}catch(e){}}
  else if(a==='stage'){st.stage=id}
  else if(a==='char'){st.char=(id&&st.char!==id)?id:null}
  else if(a==='map-char'){if(!CH[id].in[st.stage])st.stage=firstStage(id);st.char=(st.char!==id)?id:null}
  else if(a==='con'){st.con=id||null}
  else if(a==='goto-con'){st.mode='concepts';st.con=id}
  else if(a==='goto-stage'){st.mode='timeline';st.stage=id;st.char=null}
  else if(a==='goto-char'){if(st.mode!=='timeline'||!CH[id].in[st.stage])st.stage=firstStage(id);st.mode='timeline';st.char=id}
  else if(a==='focus'){const el=$('f-'+id);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}return}
  render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset.id)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target.dataset.id)}});
function fromHash(){const h=location.hash.slice(1);if(h==='concepts'||h==='timeline'){st.mode=h;render()}}
window.addEventListener('hashchange',fromHash);
if(location.hash.slice(1)==='concepts')st.mode='concepts';
render();
</script>
</body>
</html>
